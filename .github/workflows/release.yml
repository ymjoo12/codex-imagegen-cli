name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - name: Create release notes
        run: |
          cat > release-notes.md <<'EOF'
          Prebuilt binaries are attached for macOS, Linux, and Windows.

          This release can also be run through npm package managers:

          ```bash
          npx codex-imagegen-cli --help
          bunx codex-imagegen-cli --help
          ```

          This release supports both text-to-image generation and local image
          editing/reference inputs with `--input-image`.

          Install without Cargo:

          1. Download the archive for your platform from this release.
          2. Extract `codex-imagegen` or `codex-imagegen.exe`.
          3. Put the binary in a directory on `PATH`, such as `$HOME/.local/bin`.
          4. Run `codex-imagegen --help`.

          See the README for copy-paste install commands, checksum verification,
          authentication details, and usage examples.
          EOF
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              --latest
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              --latest
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: codex-imagegen-x86_64-unknown-linux-gnu.tar.gz
          - os: macos-14
            target: x86_64-apple-darwin
            asset: codex-imagegen-x86_64-apple-darwin.tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            asset: codex-imagegen-aarch64-apple-darwin.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: codex-imagegen-x86_64-pc-windows-msvc.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Add Rust target
        run: rustup target add "${{ matrix.target }}"
      - name: Build
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Package Unix archive
        if: runner.os != 'Windows'
        run: |
          mkdir -p staging dist
          cp "target/${{ matrix.target }}/release/codex-imagegen" staging/
          cp README.md LICENSE staging/
          tar -czf "dist/${{ matrix.asset }}" -C staging codex-imagegen README.md LICENSE
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging, dist | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\codex-imagegen.exe" staging\
          Copy-Item README.md, LICENSE staging\
          Compress-Archive -Force -Path staging\* -DestinationPath "dist\${{ matrix.asset }}"
          $hash = (Get-FileHash "dist\${{ matrix.asset }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.asset }}" | Set-Content -Encoding ascii "dist\${{ matrix.asset }}.sha256"
      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  publish-npm:
    name: Publish npm package
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Ensure OIDC-capable npm
        run: npm install -g npm@^11.10.0
      - name: Validate npm package
        run: npm run test:npm
      - name: Publish to npm
        run: npm publish --access public
