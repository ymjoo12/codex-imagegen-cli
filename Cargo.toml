[package]
name = "codex-imagegen-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Generate images through the Codex Responses image_generation hosted tool using local Codex credentials."

[[bin]]
name = "codex-imagegen"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["fs", "macros", "rt-multi-thread", "time"] }

[dev-dependencies]
tempfile = "3.23"
