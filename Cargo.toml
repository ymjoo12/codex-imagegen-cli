[package]
name = "codex-imagegen-cli"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Generate or edit images through the Codex Responses image_generation hosted tool using local Codex credentials."

[[bin]]
name = "codex-imagegen"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.48", features = ["fs", "macros", "rt-multi-thread", "time"] }
toml = "1.1"
uuid = { version = "1.18", features = ["v4", "v7"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["crypto-rust", "linux-native-async-persistent"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native", "crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["crypto-rust", "windows-native"] }

[target.'cfg(any(target_os = "freebsd", target_os = "openbsd"))'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["crypto-rust", "sync-secret-service"] }

[target.'cfg(not(any(target_os = "linux", target_os = "macos", target_os = "windows", target_os = "freebsd", target_os = "openbsd")))'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["crypto-rust"] }

[dev-dependencies]
tempfile = "3.23"
